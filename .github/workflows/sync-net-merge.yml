name: sync-net-merge
# Runs whenever net-merge/net-merge publishes a release, and pulls that engine into NetPilot so
# users always get the newest engine from this one repo. It opens a PR; the release workflow
# (release.yml) builds and publishes NetPilot on merge.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'net-merge tag to sync (e.g. 0.3.6); leave blank for latest'
        required: false
        type: string
  repository_dispatch:
    types: [net-merge-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Determine net-merge tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event.action }}" = "net-merge-release" ]; then
            tag="${{ github.event.client_payload.tag }}"
          else
            tag=$(curl -fsSL https://api.github.com/repos/net-merge/net-merge/releases/latest \
              | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"//;s/".*//')
          fi
          tag=${tag#v}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Syncing net-merge v$tag"
      - name: Sync engine packages
        run: bash scripts/sync-net-merge.sh "${{ steps.tag.outputs.tag }}"
      - name: Build and vet to prove the sync compiles
        run: |
          cd frontend && (npm ci || npm install) && npm run build && cd ..
          go vet ./...
          go build ./cmd/netpilot
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          branch="sync/net-merge-v${tag}"
          git config user.name "netpilot-sync[bot]"
          git config user.email "sync@netpilot.dev"
          git checkout -b "$branch"
          git add -A
          git commit -m "sync: net-merge engine v${tag}" || { echo "nothing to commit"; exit 0; }
          git push -fu origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "sync: net-merge engine v${tag}" \
            --body "Automated sync of the net-merge engine packages from release v${tag}.

          Engine packages replaced: engine, icon, logx, nics, platform, state, tray, tun, update.
          Imports rewritten net-merge/ -> netpilot/ (Go internal/ rule).
          Vet and build pass on the sync branch."