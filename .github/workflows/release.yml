name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build NetPilot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/netpilot.exe ./cmd/netpilot
      - name: Fetch wintun.dll
        shell: pwsh
        run: |
          if (Test-Path scripts/fetch-wintun.ps1) { scripts/fetch-wintun.ps1 dist } else { Write-Host 'no fetch-wintun.ps1' }
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE -Force
          Copy-Item THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES.md -Force
          Compress-Archive -Path dist/* -DestinationPath netpilot-windows-amd64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: netpilot-windows-amd64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build universal binary
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/netpilot-$arch ./cmd/netpilot
          done
          lipo -create -output dist/netpilot dist/netpilot-amd64 dist/netpilot-arm64
          rm dist/netpilot-amd64 dist/netpilot-arm64
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          tar -C dist -czf netpilot-macos-universal.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: netpilot-macos-universal.tar.gz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build NetPilot
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o dist/netpilot ./cmd/netpilot
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          tar -C dist -czf netpilot-linux-amd64.tar.gz .
      - name: Build AppImage
        run: |
          set -euo pipefail
          # AppDir layout required by the AppImage spec
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          cp packaging/icons/hicolor/512x512/apps/net-merge.png \
             "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png"
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          # appimagetool needs FUSE, which containers lack: extract and run it instead.
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-amd64.AppImage
          chmod +x netpilot-linux-amd64.AppImage
          ls -lh netpilot-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            netpilot-linux-amd64.tar.gz
            netpilot-linux-amd64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" out/* \
            --title "NetPilot $tag" \
            --notes "NetPilot $tag — bundles the latest net-merge engine. Assets: Windows portable zip, macOS universal tarball, Linux amd64 tarball and AppImage." \
            --latest
