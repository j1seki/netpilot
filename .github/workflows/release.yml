name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build NetPilot GUI
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$version" -o dist/netpilot.exe ./cmd/netpilot
      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          Copy-Item packaging/netpilot.ico dist/netpilot.ico -Force
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc "/DVersion=$version" installer/netpilot.iss
          Get-ChildItem dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/netpilot-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build NetPilot macOS universal
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/netpilot-$arch ./cmd/netpilot
          done
          lipo -create -output dist/netpilot dist/netpilot-amd64 dist/netpilot-arm64
          codesign --force --sign - dist/netpilot
      - name: Build macOS DMG
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          APP="NetPilot.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/netpilot "$APP/Contents/MacOS/netpilot"
          chmod +x "$APP/Contents/MacOS/netpilot"

          mkdir -p AppIcon.iconset
          sips -z 16 16 packaging/icons/hicolor/16x16/apps/net-merge.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 packaging/icons/hicolor/64x64/apps/net-merge.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 packaging/icons/hicolor/128x128/apps/net-merge.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>netpilot</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.netpilot.desktop</string>
              <key>CFBundleName</key>
              <string>NetPilot</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$v</string>
              <key>CFBundleVersion</key>
              <string>$v</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP"

          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          cp LICENSE THIRD-PARTY-NOTICES.md dmg_root/

          hdiutil create -volname "NetPilot" -srcfolder dmg_root -ov -format UDZO netpilot-macos-universal.dmg
          ls -lh netpilot-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: netpilot-macos-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build NetPilot
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist
          CGO_ENABLED=1 go build -tags gtk3 -trimpath -ldflags "-s -w -X main.version=$v" -o dist/netpilot ./cmd/netpilot
      - name: Build AppImage
        run: |
          set -euo pipefail
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          chmod +x "$appdir/usr/bin/netpilot"

          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          cp packaging/icons/hicolor/512x512/apps/net-merge.png \
             "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png"
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"

          # Check for WebKitGTK library presence
          if ! ldconfig -p 2>/dev/null | grep -qE "libwebkit2gtk-4\.[01]\.so|libwebkitgtk-6\.0\.so"; then
            echo "Notice: WebKitGTK runtime library not detected in system cache." >&2
            echo "If the window does not appear, install it via: sudo apt install libwebkit2gtk-4.1-0" >&2
          fi

          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-amd64.AppImage
          chmod +x netpilot-linux-amd64.AppImage
          ls -lh netpilot-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: netpilot-linux-amd64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -lh out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes=$(cat <<'EOF'
          NetPilot release — multi-network manager desktop application.

          NetPilot works alongside the official net-merge engine. Download net-merge for your platform from https://github.com/net-merge/net-merge/releases and place it in the same directory.

          Packages:
          - Linux: netpilot-linux-amd64.AppImage
          - macOS: netpilot-macos-universal.dmg
          - Windows: netpilot-setup.exe (installer)
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "NetPilot $tag" --notes "$notes"
          else
            gh release create "$tag" out/* \
              --title "NetPilot $tag" \
              --notes "$notes" \
              --latest
          fi
