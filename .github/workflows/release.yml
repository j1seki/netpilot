name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.3.6)'
        required: true

permissions:
  contents: write

jobs:
  verify-engine-version:
    # Blocks the v0.3.11 failure mode: publishing a release whose notes/binary
    # claim net-merge vX.Y.Z while the build actually embeds an older engine.
    # internal/netmerge/VERSION is the source of truth; a test verifies go:embed
    # compiled that exact value into the engine package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify embedded engine version is present in this commit
        shell: bash
        run: |
          set -euo pipefail
          # Guard against the v0.3.11 failure mode: a release whose notes/binary
          # claim net-merge vX.Y.Z while the build actually embeds an older engine.
          # The VERSION file is the single source of truth. Confirm it exists, is
          # a plausible version, and that the engine source referenced by the
          # single binary is present in this checkout. The post-build step below
          # verifies the compiled binary reports the same version at runtime.
          version=$(tr -d '[:space:]' < internal/netmerge/VERSION)
          if [ -z "$version" ]; then
            echo "::error::internal/netmerge/VERSION is empty"
            exit 1
          fi
          echo "Release will embed net-merge v${version}"
          test -f internal/engine/sched.go
          test -f cmd/netpilot/subcommands.go

          # go:embed must actually compile the recorded VERSION into the binary.
          # This test compares EmbeddedVersion() with the VERSION file on disk.
          CGO_ENABLED=0 go test ./internal/netmerge -run TestEmbeddedVersionMatchesVERSIONFile -count=1

  engine:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Pin the latest stable upstream release for all artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/net-merge/net-merge/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: [engine, verify-engine-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Bundle verified net-merge and build NetPilot
        env:
          ENGINE_TAG: ${{ needs.engine.outputs.tag }}
          NETPILOT_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:NETPILOT_TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          go run scripts/bundle-net-merge.go windows amd64 $env:ENGINE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not bundle official net-merge' }
          Copy-Item internal/netmerge/embedded/bin/wintun.dll dist/wintun.dll -Force
          Copy-Item internal/netmerge/embedded/bin/wintun-LICENSE.txt dist/wintun-LICENSE.txt -Force

          # Build NetPilot single binary (-H=windowsgui so no console window ever pops up; netpilot run/tray/etc. are subcommands of this binary)
          go build -trimpath -ldflags "-s -w -H=windowsgui -X netpilot/internal/branding.AppVersion=$version" -o dist/netpilot.exe ./cmd/netpilot

      - name: Build Windows installer (.exe) and Portable ZIP
        env:
          NETPILOT_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:NETPILOT_TAG.TrimStart('v')
          # Inno Setup's VersionInfoVersion must be numeric X.Y.Z.W. Derive it from
          # the leading version numbers, e.g. 0.4.0-beta.1 -> 0.4.0.0.
          $numericVersion = '0.0.0.0'
          if ($version -match '^(\d+)\.(\d+)\.(\d+)') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          }
          Copy-Item packaging/netpilot.ico dist/netpilot.ico -Force
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc "/DVersion=$version" "/DNumericVersion=$numericVersion" installer/netpilot.iss
          Compress-Archive -Path dist/netpilot.exe, dist/wintun.dll, dist/wintun-LICENSE.txt, dist/netpilot.ico, LICENSE, THIRD-PARTY-NOTICES.md, README.md -DestinationPath dist/netpilot-windows-amd64-portable.zip -Force
          Get-ChildItem dist/*.exe, dist/*.zip
          Move-Item -Path dist/netpilot-setup.exe -Destination "dist/netpilot-$version-installer.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/netpilot-*-installer.exe
            dist/netpilot-windows-amd64-portable.zip
          if-no-files-found: error

  macos:
    needs: [engine, verify-engine-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot macOS Universal
        env:
          ENGINE_TAG: ${{ needs.engine.outputs.tag }}
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          go run scripts/bundle-net-merge.go darwin arm64 "$ENGINE_TAG"

          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot-$arch ./cmd/netpilot
          done
          lipo -create -output dist/netpilot dist/netpilot-amd64 dist/netpilot-arm64
          codesign --force --sign - dist/netpilot

          want_engine=$(tr -d '[:space:]' < internal/netmerge/VERSION)
          built_engine=$(dist/netpilot version 2>/dev/null || true)
          case "$built_engine" in
            *"net-merge ${want_engine#v}"*) echo "Verified embedded engine: $built_engine" ;;
            *) echo "::error::Engine version mismatch: binary reports '$built_engine', expected net-merge $want_engine"; exit 1 ;;
          esac
      - name: Build macOS DMG
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          APP="NetPilot.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/netpilot "$APP/Contents/MacOS/netpilot"
          chmod +x "$APP/Contents/MacOS/netpilot"

          mkdir -p AppIcon.iconset
          sips -z 16 16 packaging/icons/hicolor/16x16/apps/net-merge.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 packaging/icons/hicolor/64x64/apps/net-merge.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 packaging/icons/hicolor/128x128/apps/net-merge.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>netpilot</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.netpilot.desktop</string>
              <key>CFBundleName</key>
              <string>NetPilot</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$v</string>
              <key>CFBundleVersion</key>
              <string>$v</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP"

          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          install -m 755 'packaging/Open NetPilot.command' 'dmg_root/Open NetPilot.command'
          ln -s /Applications dmg_root/Applications
          cp LICENSE THIRD-PARTY-NOTICES.md dmg_root/

          hdiutil create -volname "NetPilot" -srcfolder dmg_root -ov -format UDZO netpilot-macos-universal.dmg
          ls -lh netpilot-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: netpilot-macos-universal.dmg
          if-no-files-found: error

  linux:
    needs: [engine, verify-engine-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot (Linux)
        env:
          ENGINE_TAG: ${{ needs.engine.outputs.tag }}
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          go run scripts/bundle-net-merge.go linux amd64 "$ENGINE_TAG"

          CGO_ENABLED=1 go build -tags gtk3 -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot ./cmd/netpilot

          # Build-time proof that the binary embeds the recorded engine version.
          # `version` is a pure CLI subcommand (no webview), so it is safe to run here.
          want_engine=$(tr -d '[:space:]' < internal/netmerge/VERSION)
          built_engine=$(./dist/netpilot version 2>/dev/null || true)
          case "$built_engine" in
            *"net-merge ${want_engine#v}"*) echo "Verified embedded engine: $built_engine" ;;
            *) echo "::error::Engine version mismatch: binary reports '$built_engine', expected net-merge $want_engine"; exit 1 ;;
          esac
      - name: Build Universal Portable AppImage (All Desktop Environments)
        run: |
          set -euo pipefail
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/32x32/apps" \
                   "$appdir/usr/share/icons/hicolor/128x128/apps" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          chmod +x "$appdir/usr/bin/netpilot"

          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          for sz in 32x32 128x128 256x256 512x512; do
            cp "packaging/icons/hicolor/$sz/apps/net-merge.png" \
               "$appdir/usr/share/icons/hicolor/$sz/apps/netpilot.png"
          done
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          ln -sf netpilot.png "$appdir/.DirIcon"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          # Ensure StatusNotifierItem / AppIndicator tray icons resolve across KDE, GNOME, XFCE, Cinnamon, MATE, Sway, Hyprland
          ICON_DST="${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor/32x32/apps"
          mkdir -p "$ICON_DST" 2>/dev/null || true
          cp -f "$HERE/usr/share/icons/hicolor/32x32/apps/netpilot.png" "$ICON_DST/netpilot.png" 2>/dev/null || true

          # Wayland/X11 WebKit compositing stability across desktop environments
          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"

          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-amd64.AppImage
          chmod +x netpilot-linux-amd64.AppImage
          ls -lh netpilot-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: netpilot-linux-amd64.AppImage
          if-no-files-found: error

  linux-arm64:
    # Native arm64 runner: Wails needs cgo + arm64 GTK/WebKit, so cross-compiling the
    # AppImage on the amd64 runner is not possible without a full sysroot.
    needs: [engine, verify-engine-version]
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot (Linux arm64)
        env:
          ENGINE_TAG: ${{ needs.engine.outputs.tag }}
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          go run scripts/bundle-net-merge.go linux arm64 "$ENGINE_TAG"
          CGO_ENABLED=1 GOARCH=arm64 go build -tags gtk3 -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot ./cmd/netpilot

          want_engine=$(tr -d '[:space:]' < internal/netmerge/VERSION)
          built_engine=$(./dist/netpilot version 2>/dev/null || true)
          case "$built_engine" in
            *"net-merge ${want_engine#v}"*) echo "Verified embedded engine: $built_engine" ;;
            *) echo "::error::Engine version mismatch: binary reports '$built_engine', expected net-merge $want_engine"; exit 1 ;;
          esac
      - name: Build arm64 Portable AppImage
        run: |
          set -euo pipefail
          appdir=AppDir-arm64
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/32x32/apps" \
                   "$appdir/usr/share/icons/hicolor/128x128/apps" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          chmod +x "$appdir/usr/bin/netpilot"

          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          for sz in 32x32 128x128 256x256 512x512; do
            cp "packaging/icons/hicolor/$sz/apps/net-merge.png" \
               "$appdir/usr/share/icons/hicolor/$sz/apps/netpilot.png"
          done
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          ln -sf netpilot.png "$appdir/.DirIcon"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          ICON_DST="${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor/32x32/apps"
          mkdir -p "$ICON_DST" 2>/dev/null || true
          cp -f "$HERE/usr/share/icons/hicolor/32x32/apps/netpilot.png" "$ICON_DST/netpilot.png" 2>/dev/null || true

          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"

          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=aarch64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-arm64.AppImage
          chmod +x netpilot-linux-arm64.AppImage
          ls -lh netpilot-linux-arm64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: netpilot-linux-arm64.AppImage
          if-no-files-found: error

  publish:
    needs: [engine, windows, macos, linux, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          # Every downloadable asset carries the release version in its name,
          # e.g. netpilot-0.4.0-installer.exe. The filename is derived here in
          # the publish step so the per-platform build jobs stay unchanged.
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            case "$base" in
              "netpilot-${version}-installer.exe") name="$base" ;;
              netpilot-windows-amd64-portable.zip) name="netpilot-${version}-windows-amd64-portable.zip" ;;
              netpilot-macos-universal.dmg)        name="netpilot-${version}-macos-universal.dmg" ;;
              netpilot-linux-amd64.AppImage)       name="netpilot-${version}-linux-amd64.AppImage" ;;
              netpilot-linux-arm64.AppImage)       name="netpilot-${version}-linux-arm64.AppImage" ;;
              *) echo "::error::Unexpected artifact filename: $base"; exit 1 ;;
            esac
            cp "$file" "out/$name"
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' \) -print0)
          # Integrity metadata for the in-app updater (and for manual checks).
          # The filenames here include the version, so this file is stable across
          # releases and can be matched asset-by-asset by NetPilot.
          (cd out && rm -f checksums.txt && sha256sum ./* > checksums.txt)
          ls -lh out
      - name: Determine release channel
        id: channel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must be vX.Y.Z (stable) or vX.Y.Z-<prerelease> (beta); got '$tag'"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          VERSION: ${{ inputs.tag || github.ref_name }}
          ENGINE_TAG: ${{ needs.engine.outputs.tag }}
        run: |
          tag="$VERSION"
          version="${tag#v}"
          nm_ver=$(tr -d '[:space:]' < internal/netmerge/VERSION)
          # GitHub has no separate "channel" field: the prerelease flag is the
          # channel marker. Stable releases are normal releases; beta releases
          # are prereleases and must never take Latest.
          prerelease=false
          channel_label="Stable"
          channel_note="offered to NetPilot's Stable and Beta update channels."
          if [ "$CHANNEL" = "beta" ]; then
            prerelease=true
            channel_label="Beta"
            channel_note="offered to NetPilot's Beta update channel. This is a GitHub prerelease and never takes the Latest badge."
          fi

          # GitHub's automatic Latest selection is based on creation date, not
          # semver, so rebuilding an old backport would otherwise take the badge
          # from a newer stable release. Promote only a tag that is at least as
          # new as the current Latest (re-running the current release keeps it).
          make_latest=false
          if [ "$prerelease" = "false" ]; then
            make_latest=true
            current=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -n "$current" ] && [ "$current" != "$tag" ]; then
              highest=$(printf '%s\n%s\n' "${current#v}" "$version" | sort -V | tail -n1)
              if [ "$highest" != "$version" ]; then
                make_latest=false
              fi
            fi
          fi

          notes=$(cat <<EOF
          NetPilot $tag — Multi-Adapter Network Control Center, bundled with official net-merge ${ENGINE_TAG}.

          Release channel: **${channel_label}** — ${channel_note}

          Highlights:
          - Click the Active Processes column triangles to sort by network traffic, CPU, RAM, name, or PID in either direction
          - Responsive dashboard layouts and collapsible network adapter groups
          - NetPilot's integrated engine is ${nm_ver}; the official engine is bundled separately
          - Beszel-inspired dark UI with real-time per-adapter telemetry
          - Speed Mode (simultaneous multi-link aggregation) & Backup Mode (primary-to-secondary automatic failover)
          - Upgrade or downgrade official net-merge releases in Settings; switch back to the bundled release or the NetPilot engine at any time
          - Silent Windows execution (no console popups) & minimize-to-tray support across Windows, macOS, and Linux Desktop Environments

          Packages (all include version ${version}):
          - Linux: netpilot-${version}-linux-amd64.AppImage & netpilot-${version}-linux-arm64.AppImage (portable across all Linux desktop environments)
          - macOS: netpilot-${version}-macos-universal.dmg (Intel & Apple Silicon)
          - Windows: netpilot-${version}-installer.exe (installer) & netpilot-${version}-windows-amd64-portable.zip

          All packages are listed in checksums.txt; NetPilot's updater verifies the SHA-256 before installing.
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            if [ "$prerelease" = "true" ]; then
              gh release edit "$tag" --title "NetPilot $tag" --notes "$notes" --prerelease
            else
              gh release edit "$tag" --title "NetPilot $tag" --notes "$notes"
            fi
            # Use the API for the same reason as creation: `make_latest` is
            # explicit, so beta builds never claim it and old backports do not
            # displace a newer stable release.
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F prerelease="$prerelease" -f make_latest="$make_latest" >/dev/null
          elif [ "$prerelease" = "true" ]; then
            gh release create "$tag" out/* --title "NetPilot $tag" --notes "$notes" \
              --prerelease --latest=false
          else
            gh release create "$tag" out/* --title "NetPilot $tag" --notes "$notes" \
              --latest="$make_latest"
          fi
