name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.3.6)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build single-binary NetPilot + embed Wintun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force internal/netmerge/embedded/bin | Out-Null
          # True single-binary: netpilot itself implements all net-merge subcommands (see cmd/netpilot/subcommands.go).
          # Build net-merge CLI only if needed for wintun source; do NOT ship or embed separate net-merge binaries.

          # Fetch wintun.dll from latest net-merge release
          $dl = Join-Path $env:TEMP "nm-win"
          New-Item -ItemType Directory -Force $dl | Out-Null
          gh release download --repo net-merge/net-merge --pattern 'net-merge-portable.zip' --dir $dl --clobber
          Expand-Archive -Path "$dl/net-merge-portable.zip" -DestinationPath "$dl/extracted" -Force
          Copy-Item "$dl/extracted/wintun.dll" dist/wintun.dll -Force
          if (Test-Path "$dl/extracted/wintun-LICENSE.txt") {
            Copy-Item "$dl/extracted/wintun-LICENSE.txt" dist/wintun-LICENSE.txt -Force
          }

          # Embed ONLY wintun.dll into the single NetPilot binary; auto-extracted next to netpilot.exe on first run.
          Copy-Item dist/wintun.dll internal/netmerge/embedded/bin/wintun.dll -Force

          # Build NetPilot single binary (-H=windowsgui so no console window ever pops up; netpilot run/tray/etc. are subcommands of this binary)
          go build -trimpath -ldflags "-s -w -H=windowsgui -X netpilot/internal/branding.AppVersion=$version" -o dist/netpilot.exe ./cmd/netpilot
      - name: Build Windows installer (.exe) and Portable ZIP
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          Copy-Item packaging/netpilot.ico dist/netpilot.ico -Force
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc "/DVersion=$version" installer/netpilot.iss
          Compress-Archive -Path dist/netpilot.exe, dist/wintun.dll, dist/netpilot.ico, LICENSE, THIRD-PARTY-NOTICES.md, README.md -DestinationPath dist/netpilot-windows-amd64-portable.zip -Force
          Get-ChildItem dist/*.exe, dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/netpilot-setup.exe
            dist/netpilot-windows-amd64-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot macOS Universal
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          # True single-binary: no separate net-merge binaries; netpilot handles all subcommands.

          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot-$arch ./cmd/netpilot
          done
          lipo -create -output dist/netpilot dist/netpilot-amd64 dist/netpilot-arm64
          codesign --force --sign - dist/netpilot
      - name: Build macOS DMG
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          APP="NetPilot.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/netpilot "$APP/Contents/MacOS/netpilot"
          chmod +x "$APP/Contents/MacOS/netpilot"

          mkdir -p AppIcon.iconset
          sips -z 16 16 packaging/icons/hicolor/16x16/apps/net-merge.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 packaging/icons/hicolor/32x32/apps/net-merge.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 packaging/icons/hicolor/64x64/apps/net-merge.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 packaging/icons/hicolor/128x128/apps/net-merge.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 packaging/icons/hicolor/256x256/apps/net-merge.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 packaging/icons/hicolor/512x512/apps/net-merge.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>netpilot</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.netpilot.desktop</string>
              <key>CFBundleName</key>
              <string>NetPilot</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$v</string>
              <key>CFBundleVersion</key>
              <string>$v</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP"

          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          cp LICENSE THIRD-PARTY-NOTICES.md dmg_root/

          hdiutil create -volname "NetPilot" -srcfolder dmg_root -ov -format UDZO netpilot-macos-universal.dmg
          ls -lh netpilot-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: netpilot-macos-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot (Linux)
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          # True single-binary: no separate net-merge binaries on Linux.

          CGO_ENABLED=1 go build -tags gtk3 -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot ./cmd/netpilot
      - name: Build Universal Portable AppImage (All Desktop Environments)
        run: |
          set -euo pipefail
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/32x32/apps" \
                   "$appdir/usr/share/icons/hicolor/128x128/apps" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          chmod +x "$appdir/usr/bin/netpilot"

          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          for sz in 32x32 128x128 256x256 512x512; do
            cp "packaging/icons/hicolor/$sz/apps/net-merge.png" \
               "$appdir/usr/share/icons/hicolor/$sz/apps/netpilot.png"
          done
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          ln -sf netpilot.png "$appdir/.DirIcon"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          # Ensure StatusNotifierItem / AppIndicator tray icons resolve across KDE, GNOME, XFCE, Cinnamon, MATE, Sway, Hyprland
          ICON_DST="${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor/32x32/apps"
          mkdir -p "$ICON_DST" 2>/dev/null || true
          cp -f "$HERE/usr/share/icons/hicolor/32x32/apps/netpilot.png" "$ICON_DST/netpilot.png" 2>/dev/null || true

          # Wayland/X11 WebKit compositing stability across desktop environments
          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"

          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-amd64.AppImage
          chmod +x netpilot-linux-amd64.AppImage
          ls -lh netpilot-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: netpilot-linux-amd64.AppImage
          if-no-files-found: error

  linux-arm64:
    # Native arm64 runner: Wails needs cgo + arm64 GTK/WebKit, so cross-compiling the
    # AppImage on the amd64 runner is not possible without a full sysroot.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
      - name: Build frontend with typescript-go (tsgo)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Build single-binary NetPilot (Linux arm64)
        run: |
          v="${{ inputs.tag || github.ref_name }}"; v="${v#v}"
          mkdir -p dist internal/netmerge/embedded/bin
          CGO_ENABLED=1 GOARCH=arm64 go build -tags gtk3 -trimpath -ldflags "-s -w -X netpilot/internal/branding.AppVersion=$v" -o dist/netpilot ./cmd/netpilot
      - name: Build arm64 Portable AppImage
        run: |
          set -euo pipefail
          appdir=AppDir-arm64
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/32x32/apps" \
                   "$appdir/usr/share/icons/hicolor/128x128/apps" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/doc/netpilot"
          cp dist/netpilot "$appdir/usr/bin/netpilot"
          chmod +x "$appdir/usr/bin/netpilot"

          cp packaging/appimage/netpilot.desktop "$appdir/netpilot.desktop"
          cp packaging/appimage/netpilot.desktop "$appdir/usr/share/applications/netpilot.desktop"
          for sz in 32x32 128x128 256x256 512x512; do
            cp "packaging/icons/hicolor/$sz/apps/net-merge.png" \
               "$appdir/usr/share/icons/hicolor/$sz/apps/netpilot.png"
          done
          cp "$appdir/usr/share/icons/hicolor/512x512/apps/netpilot.png" "$appdir/netpilot.png"
          ln -sf netpilot.png "$appdir/.DirIcon"
          cp LICENSE THIRD-PARTY-NOTICES.md "$appdir/usr/share/doc/netpilot/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          ICON_DST="${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor/32x32/apps"
          mkdir -p "$ICON_DST" 2>/dev/null || true
          cp -f "$HERE/usr/share/icons/hicolor/32x32/apps/netpilot.png" "$ICON_DST/netpilot.png" 2>/dev/null || true

          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"

          exec "$HERE/usr/bin/netpilot" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=aarch64 /tmp/appimagetool --appimage-extract-and-run \
            --no-appstream "$appdir" netpilot-linux-arm64.AppImage
          chmod +x netpilot-linux-arm64.AppImage
          ls -lh netpilot-linux-arm64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: netpilot-linux-arm64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -lh out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          nm_ver=$(tr -d '[:space:]' < internal/netmerge/VERSION || echo "0.3.6")
          notes=$(cat <<EOF
          NetPilot $tag — Multi-Adapter Network Control Center (single-binary NetPilot incl. net-merge engine v${nm_ver}; no separate net-merge binaries).

          Highlights:
          - Beszel-inspired dark UI with real-time per-adapter telemetry
          - Speed Mode (simultaneous multi-link aggregation) & Backup Mode (primary-to-secondary automatic failover)
          - Single-binary NetPilot (GUI + net-merge CLI + tray in one binary; auto-extracts wintun.dll on Windows)
          - Silent Windows execution (no console popups) & minimize-to-tray support across Windows, macOS, and Linux Desktop Environments

          Packages:
          - Linux: netpilot-linux-amd64.AppImage & netpilot-linux-arm64.AppImage (portable across all Linux desktop environments)
          - macOS: netpilot-macos-universal.dmg (Intel & Apple Silicon)
          - Windows: netpilot-setup.exe (installer) & netpilot-windows-amd64-portable.zip
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "NetPilot $tag" --notes "$notes"
          else
            gh release create "$tag" out/* \
              --title "NetPilot $tag" \
              --notes "$notes" \
              --latest
          fi
