name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # NetPilot's UI is Wails v3, which on Linux links against GTK4 + WebKitGTK 6.0.
  WAILS_LINUX_DEPS: libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          # The runner apt mirror is occasionally flaky (403 / exit 100): retry.
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y $WAILS_LINUX_DEPS; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
          pkg-config --exists gtk4 webkitgtk-6.0
      - name: Loopback aliases for the engine tests
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32 || true
          sudo ifconfig lo0 alias 127.0.0.3/32 || true
      - name: Build frontend assets
        run: |
          cd frontend
          npm ci || npm install
          npm run build
      - name: Vet
        run: go vet ./...
      - name: Common suite
        run: go test -v ./tests/common
      - name: Deterministic scenarios
        run: go test -v ./tests/scenarios
      - name: Linux platform suite
        if: runner.os == 'Linux'
        run: go test -v ./tests/linux
      - name: macOS platform suite
        if: runner.os == 'macOS'
        run: go test -v ./tests/macos
      - name: Windows platform suite
        if: runner.os == 'Windows'
        run: go test -v ./tests/windows
      - name: Unit tests
        run: go test ./internal/...
      - name: Build NetPilot (Linux)
        if: runner.os == 'Linux'
        run: go build -o /tmp/netpilot ./cmd/netpilot
      - name: Build NetPilot (macOS)
        if: runner.os == 'macOS'
        run: go build -o /tmp/netpilot ./cmd/netpilot
      - name: Build NetPilot (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/netpilot.exe ./cmd/netpilot
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-windows-amd64
          path: dist/netpilot.exe
          if-no-files-found: error

  # Engine-only cross-arch checks. cmd/netpilot needs cgo+webkit, which does not cross-compile
  # under qemu, so these build and test the engine packages that actually ship on those arches.
  linux-arches:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: "386"}
          - {goarch: arm, goarm: "7", qemu: qemu-arm-static}
          - {goarch: arm, goarm: "6", qemu: qemu-arm-static}
          - {goarch: riscv64, qemu: qemu-riscv64-static}
          - {goarch: ppc64le, qemu: qemu-ppc64le-static}
          - {goarch: s390x, qemu: qemu-s390x-static}
          - {goarch: loong64, qemu: qemu-loongarch64-static}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install qemu
        if: matrix.qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Vet and test engine
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          # ttlmgr's lock-liveness test needs real pid signal semantics, which qemu's s390x
          # user-mode emulation lacks; the package is still covered on native runs.
          ENGINE_PKGS: ${{ matrix.goarch == 's390x' && './internal/engine/... ./internal/tun/... ./internal/scenarios/... ./internal/state/... ./internal/nics/... ./internal/platform/... ./internal/update/...' || './internal/...' }}
        run: |
          go vet ./internal/... ./tests/...
          go test -timeout 10m ${{ matrix.qemu && format('-exec {0}', matrix.qemu) || '' }} $ENGINE_PKGS ./tests/common ./tests/scenarios

  # Catches a broken embed: proves the committed frontend/dist is what go build consumes.
  embed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -f frontend/dist/index.html
      - run: CGO_ENABLED=0 go build -o /dev/null ./internal/engine ./internal/tun ./internal/ttlmgr ./internal/scenarios
      - run: CGO_ENABLED=0 go list -deps ./frontend >/dev/null
